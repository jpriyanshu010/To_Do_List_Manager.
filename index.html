
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>priyanshu's To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="todo-container">
        <h1>priyanshu's To-Do List</h1>
        <p class="subtitle">Organize your day, one task at a time.</p>

        <div class="task-input">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
                aria-label="New task"
            >
            <button id="addBtn">Add Task</button>
        </div>

        <div class="task-stats">
            <span>Total: <strong id="totalCount">0</strong></span>
            <span>Completed: <strong id="completedCount">0</strong></span>
        </div>

        <ul id="taskList"></ul>

        <p id="emptyMessage">No tasks yet. Add your first task!</p>
    </main>
</body>
</html>
